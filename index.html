<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPEX — Sistema de Gestión Integral</title>
    <meta name="description"
        content="Sistema de gestión integral para MEPEX — Montaje y Equipamiento para Exposiciones">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/mepex_iso.png">

    <!-- PWA (Etapa E4) — sin la app instalada en la pantalla de inicio, en iPhone
         NO llega ningún push. Requiere display:standalone en el manifest. -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00A9C1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEPEX">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=2">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css?v=19">
    <!-- Tanda 4 — Mobile/Tablet responsive (carga DESPUÉS de style.css) -->
    <link rel="stylesheet" href="mobile.css?v=4">
</head>

<body>
    <div id="app">
        <!-- SPA content renders here -->
        <div class="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- CORE (carga diferida 2026-07-15): el login solo trae esto.
         El RESTO de la app (~45 scripts + jsPDF/Chart.js/qrcode) lo inyecta
         App.ensureAppLoaded() (app.js) recién con usuario autenticado —
         menos peso en el login y sin exponer el JS interno. La lista y el
         ORDEN viven en App._APP_SCRIPTS: bumpear versiones AHÍ, no acá. -->
    <script src="config.js?v=5"></script>
    <script src="data.js?v=28"></script>
    <script src="router.js?v=26"></script>
    <script src="auth.js?v=10"></script>
    <script src="audit-log.js?v=3"></script>
    <script src="app.js?v=36"></script>
</body>

</html>
