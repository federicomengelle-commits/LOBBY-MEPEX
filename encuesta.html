<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta — MEPEX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="assets/mepex_iso.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #00A9C1;
            --brand: #00ABC8;
            --bg: #050505;
            --bg-card: #0d0d0d;
            --border: #262626;
            --text-primary: #E8E8E8;
            --text-muted: #8f8f8f;
            --text-dim: #565656;
            --success: #00CC88;
            --error: #ff4444;
            --accent: #F28D15;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        body {
            display: flex; align-items: center; justify-content: center; padding: 20px;
            background-image:
                linear-gradient(90deg, rgba(0,171,200,0.025) 1px, transparent 1px),
                linear-gradient(rgba(0,171,200,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .card {
            position: relative; overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 460px;
            width: 100%;
            padding: 30px 26px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--brand); z-index: 2;
        }
        .card-wmk {
            position: absolute; right: -46px; bottom: -46px; width: 210px; height: 210px;
            color: var(--brand); opacity: 0.05; z-index: 0; pointer-events: none;
        }
        .header, .ctx, #encForm { position: relative; z-index: 1; }
        .brand-logo { width: 122px; height: 52px; color: var(--brand); display: block; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 22px; }
        .header h1 { font-size: 1.3rem; font-weight: 600; color: var(--text-primary); margin: 16px 0 4px; }
        .header p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.4; }
        .ctx {
            background: rgba(0,171,200,0.08);
            border: 1px solid rgba(0,171,200,0.25);
            border-radius: 11px;
            padding: 12px 14px;
            margin-bottom: 24px;
            text-align: center;
        }
        .ctx .proj { color: var(--brand); font-weight: 600; font-size: 1rem; }
        .ctx .sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; font-family: 'Space Mono', monospace; }
        .q-label { display: block; font-size: 0.94rem; font-weight: 500; margin-bottom: 12px; }
        .sec-title {
            font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 0.13em; margin: 26px 0 12px;
        }
        .nps-scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; margin-bottom: 8px; }
        .nps-btn {
            aspect-ratio: 1; border: 1.5px solid var(--border); background: #070707;
            color: var(--text-primary); border-radius: 8px; font-family: 'Space Mono', monospace;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 160ms ease; min-height: 42px;
        }
        .nps-btn:hover { border-color: var(--brand); }
        .nps-btn.selected[data-score="0"], .nps-btn.selected[data-score="1"], .nps-btn.selected[data-score="2"],
        .nps-btn.selected[data-score="3"], .nps-btn.selected[data-score="4"], .nps-btn.selected[data-score="5"],
        .nps-btn.selected[data-score="6"] { background: var(--error); border-color: var(--error); color: #fff; }
        .nps-btn.selected[data-score="7"], .nps-btn.selected[data-score="8"] { background: var(--accent); border-color: var(--accent); color: #1a0e00; }
        .nps-btn.selected[data-score="9"], .nps-btn.selected[data-score="10"] { background: var(--success); border-color: var(--success); color: #04251a; }
        .nps-labels {
            display: flex; justify-content: space-between; font-size: 0.64rem; color: var(--text-dim);
            font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .dim {
            display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid #1a1a1a;
        }
        .dim:last-of-type { border-bottom: none; }
        .dim-label { font-size: 0.86rem; color: #d6d6d6; }
        .stars { display: flex; gap: 5px; }
        .star {
            background: none; border: none; color: #333; font-size: 1.4rem; cursor: pointer;
            padding: 2px; line-height: 1; transition: color 120ms ease; min-width: 30px; min-height: 40px;
        }
        .star.on { color: var(--accent); }
        .star:hover { color: var(--accent); }
        textarea {
            width: 100%; background: #070707; border: 1px solid var(--border); color: var(--text-primary);
            padding: 12px 14px; border-radius: 9px; font-family: 'Outfit', sans-serif; font-size: 0.92rem;
            min-height: 88px; resize: vertical; margin-top: 4px;
        }
        textarea:focus { outline: none; border-color: var(--brand); }
        .btn {
            width: 100%; background: var(--brand); color: #03222a; border: none; padding: 15px;
            border-radius: 9px; font-family: 'Space Mono', monospace; font-size: 0.92rem; font-weight: 700;
            cursor: pointer; transition: all 200ms ease; margin-top: 24px; min-height: 52px;
        }
        .btn:hover:not(:disabled) { background: #00C2DC; box-shadow: 0 0 16px rgba(0,171,200,0.5); }
        .btn:disabled { background: #262626; color: #666; cursor: not-allowed; }
        .state-screen { text-align: center; padding: 24px 0; position: relative; z-index: 1; }
        .state-icon { font-size: 3rem; margin: 14px 0 12px; }
        .state-screen h2 { font-size: 1.22rem; font-weight: 600; margin-bottom: 10px; }
        .state-screen p { color: var(--text-muted); line-height: 1.55; font-size: 0.9rem; }
        .state-screen a { color: var(--primary); text-decoration: none; }
        .load-iso {
            width: 104px; height: 104px; color: var(--brand); display: block; margin: 8px auto;
            animation: breathe 1.7s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.13; transform: scale(0.93); }
            50% { opacity: 0.42; transform: scale(1.03); }
        }
        .footer {
            margin-top: 24px; text-align: center; font-size: 0.62rem; color: var(--text-dim);
            font-family: 'Space Mono', monospace; letter-spacing: 0.05em; position: relative; z-index: 1;
        }
        .review-box {
            background: rgba(0,171,200,0.08); border: 1px solid rgba(0,171,200,0.28);
            border-radius: 11px; padding: 16px; margin: 6px 0 0; position: relative; z-index: 1;
        }
        .review-box p { font-size: 0.82rem; color: #cfcfcf; line-height: 1.5; margin: 0 0 14px; }
        .review-btn {
            display: block; width: 100%; background: var(--brand); color: #03222a; text-decoration: none;
            padding: 14px; border-radius: 9px; font-family: 'Space Mono', monospace; font-weight: 700;
            font-size: 0.9rem; text-align: center; transition: all 200ms ease; box-sizing: border-box;
        }
        .review-btn:hover { background: #00C2DC; box-shadow: 0 0 16px rgba(0,171,200,0.5); }
    </style>
</head>
