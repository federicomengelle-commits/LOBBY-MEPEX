# =====================================================================
# MEPEX — nginx vhost (copia versionada de /etc/nginx/sites-enabled/mepex)
# =====================================================================
# HTTPS con Let's Encrypt (app.mepex.com.ar) + redirect http→https +
# security headers (auditoría 2026-07 §4.2).
#
# OJO: en el VPS los backups NO van en sites-enabled/ (nginx carga
# sites-enabled/* entero → un mepex.bak ahí = "conflicting server name").
# Guardar backups fuera de esa carpeta.
# =====================================================================

# HTTP → redirige todo a HTTPS
server {
    listen 80;
    server_name 195.200.1.250 app.mepex.com.ar;
    return 301 https://app.mepex.com.ar$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name 195.200.1.250 app.mepex.com.ar;

    ssl_certificate /etc/letsencrypt/live/app.mepex.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mepex.com.ar/privkey.pem;

    # Security headers (auditoría 4.2)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/mepex/lobby;
    index index.html;

    location /octexa-api/ { proxy_pass http://127.0.0.1:3010/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 75s; client_max_body_size 512k; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    location /cotizador/ {
        alias /home/mepex/cotizador/;
        add_header Cache-Control "no-cache";
        index index.html;
    }

    location /lobby-api/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cotizador-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Generador de PROPUESTAS MEPEX (servicio nuevo, aditivo) ---
    location /propuesta-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
